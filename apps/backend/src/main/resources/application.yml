spring:
  application:
    name: sdbrewpi-platform
  datasource:
    url: jdbc:h2:file:./data/sdbrewpi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
sdbrewpi:
  auth:
    enabled: ${AUTH_ENABLED:true}
  hardware:
    enabled: ${HARDWARE_ENABLED:false}
  simulation:
    enabled: ${SIMULATION_ENABLED:true}
  plc-demo:
    enabled: ${PLC_DEMO_ENABLED:false}
    port: ${PLC_DEMO_PORT:COM5}
    baud-rate: ${PLC_DEMO_BAUD_RATE:115200}
    freshness-seconds: ${PLC_DEMO_FRESHNESS_SECONDS:10}
    history-interval-seconds: ${PLC_DEMO_HISTORY_INTERVAL_SECONDS:10}
  mqtt:
    enabled: ${MQTT_ENABLED:false}
    broker-uri: ${MQTT_BROKER_URI:tcp://192.168.1.15:1883}
    client-id: ${MQTT_CLIENT_ID:sdbrewpi-platform-local}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    topics: ${MQTT_TOPICS:sierra/rapt/+/telemetry,rapt/pill/+/history,rapt/pill/+/temperature,rapt/pill/+/gravity,rapt/pill/+/battery,rapt/pill/+/rssi,sdbrewpi/v1/+/+/telemetry}
    freshness-seconds: ${MQTT_FRESHNESS_SECONDS:90}
  web:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
